id: zmpt
name: 织梦
domain: https://zmpt.cc/
encoding: UTF-8

login:
  test:
    selector: a[href="logout.php"]

# 分类 ID 来自 2026-09 实测 (torrents.php 分类导航 + 种子行 img[class^=c_] 的 alt)
category_mappings:
  - { id: 401, cate_level1: Movie, cate_level2: Movies, cate_level2_desc: "电影" }
  - { id: 402, cate_level1: TV, cate_level2: TV, cate_level2_desc: "电视剧" }
  - { id: 403, cate_level1: TV, cate_level2: TV, cate_level2_desc: "综艺" }
  - { id: 409, cate_level1: Other, cate_level2: Other, cate_level2_desc: "其他" }
  - { id: 417, cate_level1: Anime, cate_level2: TV/Anime, cate_level2_desc: "动漫" }
  - { id: 422, cate_level1: Documentary, cate_level2: TV/Documentary, cate_level2_desc: "纪录片" }
  - { id: 423, cate_level1: Music, cate_level2: Audio, cate_level2_desc: "音乐" }
  - { id: 424, cate_level1: Other, cate_level2: Audio, cate_level2_desc: "有声书" }
  - { id: 425, cate_level1: Other, cate_level2: Other, cate_level2_desc: "软件" }
  - { id: 426, cate_level1: Other, cate_level2: Other, cate_level2_desc: "游戏" }
  - { id: 427, cate_level1: TV, cate_level2: TV, cate_level2_desc: "短剧" }

userinfo:
  path: https://zmpt.cc/index.php
  item:
    selector: table[id="info_block"]
  fields:
    uid:
      default_value: 0
      selector: a[href*="userdetails.php?id="]
      attribute: href
      filters:
        - name: re_search
          args: [ '\d+', 0 ]
    user_group:
      default_value: ''
      selector: a[href*="userdetails.php?id="]
      attribute: class
    username:
      default_value: '未知用户名'
      selector: a[href*="userdetails.php?id="] b
    share_ratio:
      default_value: ''
      selector: "font.color_ratio"
      method: next_sibling
      filters:
        - name: replace
          args: [ '无限','inf' ]
    uploaded:
      default_value: 0
      selector: "font.color_uploaded"
      method: next_sibling
      filters:
        - name: replace
          args: [ '无限','inf' ]
    downloaded:
      default_value: 0
      selector: "font.color_downloaded"
      method: next_sibling
      filters:
        - name: replace
          args: [ '无限','inf' ]
    seeding:
      default_value: 0
      selector: img[alt="Torrents seeding"]
      method: next_sibling
    leeching:
      default_value: 0
      selector: img[alt="Torrents leeching"]
      method: next_sibling

search:
  paths:
    - path: torrents.php
      method: get
  query:
    $raw: "{% for c in query.cates %}cat{{c}}=1&{% endfor %}"
    search: "{% if query.imdb_id %}{{query.imdb_id}}{%else%}{{query.keyword}}{% endif %}"
    incldead: 1
    spstate: "{% if query.free %}2{% else %}0{% endif %}"
    search_area: "{% if query.imdb_id %}4{% else %}0{%endif%}"
    search_mode: 0
    sort: "{{ query.sort }}"
    type: "{{ query.type }}"
    page: "{{ query.page }}"

# 列结构实测: 1类型 2标题 3评论 4时间(span[title]=绝对时间) 5大小 6种子 7下载 8完成 9发布者
torrents:
  list:
    selector: table.torrents tr:has(td.rowfollow)
  fields:
    id:
      selector: table.torrentname a[href^="download.php?id="]
      attribute: href
      filters:
        - name: re_search
          args: [ '\d+', 0 ]
    title_default:
      selector: table.torrentname a[href^="details.php?id="]
    title_optional:
      optional: true
      selector: table.torrentname a[title][href^="details.php?id="]
      attribute: title
    title:
      text: "{% if fields['title_optional'] %}{{ fields['title_optional'] }}{% else %}{{ fields['title_default'] }}{% endif %}"
    subject:
      selector: table.torrentname td.embedded:has(a[href*='details.php'])
      contents: -1
    category:
      selector: td:first-child a[href^="?cat="]
      attribute: href
      filters:
        - name: replace
          args: ["?", ""]
        - name: querystring
          args: ["cat"]
    details:
      selector: table.torrentname a[href^="details.php?id="]
      attribute: href
    download:
      selector: table.torrentname a[href^="download.php?id="]
      attribute: href
    imdbid:
      selector: table.torrentname img[alt="imdb"] + span
      optional: true
    size:
      selector: td.rowfollow:nth-child(5)
    date_added:
      selector: td.rowfollow:nth-child(4) > span[title]
      attribute: title
      filters:
        - name: dateparse
          args: "%Y-%m-%d %H:%M:%S"
    seeders:
      selector: td.rowfollow a[href*="dllist=1#seeders"]
    leechers:
      selector: td.rowfollow a[href*="dllist=1#leechers"]
    snatched:
      selector: td.rowfollow a[href^="viewsnatches.php?id="]
    downloadvolumefactor:
      selector: td
      case:
        ".free_bg": 0
        ".twoupfree_bg": 0
        img.pro_free: 0
        img.pro_free2up: 0
        ".halfdown_bg": 0.5
        img.pro_50pctdown: 0.5
        img.pro_50pctdown2up: 0.5
        ".d30down_bg": 0.3
        img.pro_30pctdown: 0.3
        ".d70down_bg": 0.7
        "*": 1
    uploadvolumefactor:
      selector: td
      case:
        ".twoupfree_bg": 2
        ".twoup_bg": 2
        img.pro_free2up: 2
        img.pro_50pctdown2up: 2
        img.pro_2up: 2
        "*": 1
    tags:
      selector: table.torrentname span[style*="background-color"]
    free_deadline:
      selector: img.pro_free,img.pro_free2up
      attribute: onmouseover
      filters:
        - name: re_search
          args: [ 'title="(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})"', 1 ]
