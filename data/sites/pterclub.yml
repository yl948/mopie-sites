id: pterclub
name: 猫站
domain: https://pterclub.net/
encoding: UTF-8

# verifier 实际用的是 a[href*='logout'] 或 [id='info_block']，这里仅作文档
login:
  test:
    selector: a[href*="logout"], a#logout-confirm

# 分类 ID 来自 2026-09-24 实测（导航下拉 + 种子行 ?cat=NNN + 搜索表单 catNNN）
category_mappings:
  - { id: 401, cate_level1: Movie, cate_level2: Movies, cate_level2_desc: "电影" }
  - { id: 402, cate_level1: Documentary, cate_level2: TV/Documentary, cate_level2_desc: "纪录片" }
  - { id: 403, cate_level1: Anime, cate_level2: TV/Anime, cate_level2_desc: "动画" }
  - { id: 404, cate_level1: TV, cate_level2: TV, cate_level2_desc: "电视剧" }
  - { id: 405, cate_level1: TV, cate_level2: TV, cate_level2_desc: "综艺" }
  - { id: 406, cate_level1: Music, cate_level2: Audio, cate_level2_desc: "音乐" }
  - { id: 407, cate_level1: TV, cate_level2: TV/Sport, cate_level2_desc: "体育" }
  - { id: 408, cate_level1: Other, cate_level2: Other, cate_level2_desc: "电子书" }
  - { id: 409, cate_level1: Other, cate_level2: Other, cate_level2_desc: "游戏" }
  - { id: 410, cate_level1: Other, cate_level2: Other, cate_level2_desc: "软件" }
  - { id: 411, cate_level1: Other, cate_level2: Other, cate_level2_desc: "学习" }
  - { id: 412, cate_level1: Other, cate_level2: Other, cate_level2_desc: "其它" }
  - { id: 413, cate_level1: Music, cate_level2: Audio, cate_level2_desc: "音乐短片" }
  - { id: 418, cate_level1: Music, cate_level2: Audio, cate_level2_desc: "演出" }

# 经典 NexusPHP info_block（CHD 系皮肤）。字段都挤在同一个 <td class="bottom"> 里，
# 但源码在字段之间有换行/制表符，next_sibling 的 split 规则（2+ 空白/制表/换行）能正常切出：
#   分享率： 3.259 / 上传量： 6.342 TB / 下载量： 1.946 TB
# 注意：换成把值包在独立元素里的皮肤时 next_sibling 会失败（见 pitfalls #21）。
userinfo:
  path: https://pterclub.net/index.php
  item:
    selector: 'table#info_block'
  fields:
    uid:
      default_value: 0
      selector: 'a[href*="userdetails.php?id="]'
      attribute: href
      filters:
        - name: re_search
          args: [ '\d+', 0 ]
    user_group:
      default_value: ''
      selector: 'a[href*="userdetails.php?id="]'
      attribute: class
    username:
      default_value: '未知用户名'
      selector: 'a[href*="userdetails.php?id="] b'
    share_ratio:
      default_value: ''
      selector: 'font.color_ratio'
      method: next_sibling
    uploaded:
      default_value: 0
      selector: 'font.color_uploaded'
      method: next_sibling
      filters:
        - name: replace
          args: [ '无限', 'inf' ]
    downloaded:
      default_value: 0
      selector: 'font.color_downloaded'
      method: next_sibling
      filters:
        - name: replace
          args: [ '无限', 'inf' ]
    seeding:
      default_value: 0
      selector: 'img[alt="Torrents seeding"]'
      method: next_sibling
    leeching:
      default_value: 0
      selector: 'img[alt="Torrents leeching"]'
      method: next_sibling

# 关键字参数 search + search_area；分类是同名前缀参数 cat401=1（不是 cat[]=）
search:
  paths:
    - path: torrents.php
      method: get
  query:
    $raw: "{% for c in query.cates %}cat{{c}}=1&{% endfor %}"
    search: "{{query.keyword}}"
    search_area: "{% if query.imdb_id %}4{% else %}0{% endif %}"
    search_mode: 0
    incldead: 1
    spstate: 0
    inclbookmarked: 0
    sort: "{{query.sort}}"
    type: "{{query.type}}"
    page: "{{query.page}}"

# 列表结构实测（经典 NexusPHP 9 列）：1类型 2标题格 3评论 4时间 5大小 6种子 7下载 8完成 9发布者
#   外层 td 全为 class=rowfollow，标题格内的嵌套 table.torrentname 用 class=embedded（便于 nth-child 区分）
#   标题格：<a title=... href="details.php?id="><b>标题</b></a> + 折扣 img + 剩余时间 <b><span title>
#   page=0 与 page=1 内容不重叠（skip_page1: false），每页 ~98 条
torrents:
  list:
    selector: 'table.main tr:has(table.torrentname)'
  fields:
    id:
      selector: 'a[href^="download.php?id="]'
      attribute: href
      filters:
        - name: re_search
          args: [ '\d+', 0 ]
    title:
      selector: 'a[href^="details.php?id="][title]'
    subject:
      selector: 'table.torrentname td.embedded div[style*="margin-top"] > span'
    category:
      selector: 'td.rowfollow a[href^="?cat="]'
      attribute: href
      filters:
        - name: replace
          args: [ '?', '' ]
        - name: querystring
          args: [ 'cat' ]
    details:
      selector: 'a[href^="details.php?id="][title]'
      attribute: href
    download:
      selector: 'a[href^="download.php?id="]'
      attribute: href
    size:
      selector: 'td.rowfollow:nth-child(5)'
    date_added:
      selector: 'td.rowfollow:nth-child(4) > span[title]'
      attribute: title
      filters:
        - name: dateparse
          args: [ '%Y-%m-%d %H:%M:%S' ]
    seeders:
      selector: 'a[href*="dllist=1#seeders"]'
    leechers:
      selector: 'a[href*="dllist=1#leechers"]'
    snatched:
      selector: 'a[href^="viewsnatches.php?id="]'
    downloadvolumefactor:
      selector: td
      case:
        "img.pro_free": 0
        "img.pro_free2up": 0
        "img.pro_50pctdown2up": 0.5
        "img.pro_50pctdown": 0.5
        "img.pro_30pctdown": 0.3
        "img.pro_70pctdown": 0.7
        "*": 1
    uploadvolumefactor:
      selector: td
      case:
        "img.pro_free2up": 2
        "img.pro_2up": 2
        "img.pro_50pctdown2up": 2
        "*": 1
    tags:
      selector: 'a.torrents-tag'
    free_deadline:
      selector: 'b > span[title]'
      attribute: title
      filters:
        - name: dateparse
          args: [ '%Y-%m-%d %H:%M:%S' ]
    imdbid:
      optional: true
      selector: 'span[data-imdbid]'
      attribute: data-imdbid
