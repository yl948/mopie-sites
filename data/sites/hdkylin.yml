id: hdkylin
name: 麒麟
domain: https://na.hdkylin.com/
encoding: UTF-8

login:
  test:
    selector: a[href="logout.php"]

category_mappings:
  - { id: 401, cate_level1: Movie, cate_level2: Movies, cate_level2_desc: "电影" }
  - { id: 402, cate_level1: TV, cate_level2: TV, cate_level2_desc: "电视剧" }
  - { id: 404, cate_level1: TV, cate_level2: Documentary, cate_level2_desc: "纪录教育" }
  - { id: 405, cate_level1: TV, cate_level2: Anime, cate_level2_desc: "动漫" }
  - { id: 406, cate_level1: TV, cate_level2: MusicVideo, cate_level2_desc: "音乐视频" }
  - { id: 407, cate_level1: TV, cate_level2: Sports, cate_level2_desc: "体育运动" }
  - { id: 408, cate_level1: Movie, cate_level2: Music, cate_level2_desc: "音乐" }
  - { id: 409, cate_level1: Movie, cate_level2: Misc, cate_level2_desc: "其他" }
  - { id: 411, cate_level1: Movie, cate_level2: Software, cate_level2_desc: "软件" }
  - { id: 412, cate_level1: Movie, cate_level2: Game, cate_level2_desc: "游戏" }
  - { id: 413, cate_level1: Movie, cate_level2: Ebook, cate_level2_desc: "电子书" }
  - { id: 419, cate_level1: Movie, cate_level2: Study, cate_level2_desc: "学习" }
  - { id: 420, cate_level1: TV, cate_level2: Variety, cate_level2_desc: "综艺" }
  - { id: 421, cate_level1: TV, cate_level2: Playlet, cate_level2_desc: "短剧" }

userinfo:
  path: /index.php
  item:
    selector: table[id="info_block"]
  fields:
    uid:
      default_value: 0
      selector: a[href*="userdetails.php?id="]
      attribute: href
      filters:
        - name: re_search
          args: ['\d+', 0]
    user_group:
      default_value: ''
      selector: a[href*="userdetails.php?id="]
      attribute: class
    username:
      default_value: '未知用户名'
      selector: a[href*="userdetails.php?id="] b
    share_ratio:
      default_value: ''
      selector: "font.color_ratio"
      method: next_sibling
    uploaded:
      default_value: 0
      selector: "font.color_uploaded"
      method: next_sibling
    downloaded:
      default_value: 0
      selector: "font.color_downloaded"
      method: next_sibling
    seeding:
      default_value: 0
      selector: img[alt="Torrents seeding"]
      method: next_sibling
    leeching:
      default_value: 0
      selector: img[alt="Torrents leeching"]
      method: next_sibling

search:
  paths:
    - path: torrents.php
      method: get
  query:
    $raw: "{% for c in query.cates %}cat{{c}}=1&{% endfor %}"
    search: "{% if query.imdb_id %}{{query.imdb_id}}{%else%}{{query.keyword}}{% endif %}"
    incldead: 1
    spstate: "{% if query.free %}2{% else %}0{% endif %}"
    search_area: "{% if query.imdb_id %}4{% else %}0{%endif%}"
    search_mode: 0
    sort: "{{ query.sort }}"
    type: "{{ query.type }}"
    page: "{{ query.page }}"

torrents:
  list:
    selector: table.torrents > tbody > tr:has(table.torrentname)
  fields:
    id:
      selector: a[href^="details.php?id="]
      attribute: href
      filters:
        - name: re_search
          args: ['\d+', 0]
    title:
      selector: td.embedded a[href^="details.php?id="]
    category:
      selector: a[href^="?cat="]
      attribute: href
      filters:
        - name: replace
          args: ["?", ""]
        - name: querystring
          args: ["cat"]
    details:
      selector: a[href^="details.php?id="]
      attribute: href
    download:
      selector: a[href^="download.php?id="]
      attribute: href
    imdbid:
      selector: a[href*="imdb.com"]
      attribute: href
      optional: true
    size:
      selector: td.rowfollow:nth-child(5)
    date_added:
      selector: td.rowfollow:nth-child(4) span[title]
      attribute: title
      optional: true
    seeders:
      selector: 'a[href*="#seeders"]'
    leechers:
      selector: 'a[href*="#leechers"]'
    completed:
      selector: 'a[href*="viewsnatches"], a[href*="snatched"]'
    free_deadline:
      selector: 'span[title^="20"]'
      attribute: title
    subject:
      selector: td.embedded:has(a[href*="details.php"])
      contents: -1
    tags:
      selector: td.embedded span[style*="background-image"]
    downloadvolumefactor:
      case:
        "img.pro_free": 0
        "img.pro_free2up": 0
        "img.pro_50pctdown": 0.5
        "img.pro_50pctdown2up": 0.5
        "img.pro_30pctdown": 0.3
        "img.pro_70pctdown": 0.7
        "*": 1
    uploadvolumefactor:
      case:
        "img.pro_free2up": 2
        "img.pro_50pctdown2up": 2
        "img.pro_2up": 2
        "*": 1
