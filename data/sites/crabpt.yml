# 蟹黄堡 crabpt.vip — NexusPHP 经典皮肤
# 适配: 2026-10-06 实测。列: 1类型 2标题 3评论 4时间 5大小 6种子 7下载 8完成 9发布者
# 同 carpt 骨架（嵌套表 4 格：海报|标题|IMDb/豆瓣|下载）。有 dllist 锚点（同 kufei 通用写法）。
# 促销只有 img.pro_free / pro_free2up，**无 onmouseover、无剩余时间**（free_deadline 恒空）。
# 大小格/时间格内含 <br/>（"2.26<br/>MB"、"2年<br/>6月"），绝对时间在 span[title]。
# 单枚 c_secure_pass cookie 即可登录（无需 c_secure_uid 等全套）。
id: crabpt
name: 蟹黄堡
domain: https://crabpt.vip/
encoding: UTF-8

login:
  test:
    selector: a[href="logout.php"]

# 分类来自搜索表单 cat401-409 + cat413 复选框（413 短剧是该站特有）
category_mappings:
  - { id: 401, cate_level1: Movie, cate_level2: Movies, cate_level2_desc: "电影" }
  - { id: 402, cate_level1: TV, cate_level2: TV, cate_level2_desc: "电视剧" }
  - { id: 403, cate_level1: TV, cate_level2: TV, cate_level2_desc: "综艺" }
  - { id: 404, cate_level1: Documentary, cate_level2: TV/Documentary, cate_level2_desc: "纪录片" }
  - { id: 405, cate_level1: Anime, cate_level2: TV/Anime, cate_level2_desc: "动漫" }
  - { id: 406, cate_level1: Music, cate_level2: Audio/Video, cate_level2_desc: "MV" }
  - { id: 407, cate_level1: TV, cate_level2: TV/Sport, cate_level2_desc: "体育竞技" }
  - { id: 408, cate_level1: Music, cate_level2: Audio, cate_level2_desc: "音乐" }
  - { id: 409, cate_level1: Other, cate_level2: Other, cate_level2_desc: "其他" }
  - { id: 413, cate_level1: TV, cate_level2: TV, cate_level2_desc: "短剧" }

userinfo:
  path: https://crabpt.vip/index.php
  item:
    selector: table[id="info_block"]
  fields:
    uid:
      default_value: 0
      selector: a[href*="userdetails.php?id="]
      attribute: href
      filters:
        - name: re_search
          args: [ '\d+', 0 ]
    user_group:
      default_value: ''
      selector: a[href*="userdetails.php?id="]
      attribute: class
    username:
      default_value: '未知用户名'
      selector: a[href*="userdetails.php?id="] b
    share_ratio:
      default_value: ''
      selector: "font.color_ratio"
      method: next_sibling
      filters:
        - name: replace
          args: [ '无限','inf' ]
    uploaded:
      default_value: 0
      selector: "font.color_uploaded"
      method: next_sibling
      filters:
        - name: replace
          args: [ '无限','inf' ]
    downloaded:
      default_value: 0
      selector: "font.color_downloaded"
      method: next_sibling
      filters:
        - name: replace
          args: [ '无限','inf' ]
    # 做种/下载数不配（同春天/下水道）：计数是裸文本节点，next_sibling 会抓到
    # “欢迎回来, …”，且 sites 表本就没有这两列

search:
  paths:
    - path: torrents.php
      method: get
  query:
    $raw: "{% for c in query.cates %}cat{{c}}=1&{% endfor %}"
    search: "{% if query.imdb_id %}{{query.imdb_id}}{%else%}{{query.keyword}}{% endif %}"
    incldead: 1
    spstate: "{% if query.free %}2{% else %}0{% endif %}"
    search_area: "{% if query.imdb_id %}4{% else %}0{%endif%}"
    search_mode: 0
    sort: "{{ query.sort }}"
    type: "{{ query.type }}"
    page: "{{ query.page }}"

# page=0 与 page=1 零重叠，page1 无置顶（置顶只在 page0），skip_page1: false
torrents:
  list:
    selector: table.torrents > tbody > tr:has(table.torrentname)
  fields:
    id:
      selector: table.torrentname a[href^="download.php?id="]
      attribute: href
      filters:
        - name: re_search
          args: [ '\d+', 0 ]
    title_default:
      selector: table.torrentname a[href^="details.php?id="]
    title_optional:
      optional: true
      selector: table.torrentname a[title][href^="details.php?id="]
      attribute: title
    title:
      text: "{% if fields['title_optional'] %}{{ fields.title_optional }}{% else %}{{ fields.title_default }}{% endif %}"
    # 海报在嵌套表首格（lazy-load img），titleEmbedded 取海报格返回空 → YAML subject 生效
    subject:
      selector: table.torrentname td.embedded:has(a[href*='details.php'])
      contents: -1
    category:
      selector: td:first-child a[href^="?cat="]
      attribute: href
      filters:
        - name: replace
          args: ["?", ""]
        - name: querystring
          args: ["cat"]
    details:
      selector: table.torrentname a[href^="details.php?id="]
      attribute: href
    download:
      selector: table.torrentname a[href^="download.php?id="]
      attribute: href
    size:
      selector: td.rowfollow:nth-child(5)
    date_added:
      selector: td.rowfollow:nth-child(4) > span[title]
      attribute: title
      filters:
        - name: dateparse
          args: "%Y-%m-%d %H:%M:%S"
    seeders:
      selector: 'a[href*="#seeders"]'
    leechers:
      selector: 'a[href*="#leechers"]'
    snatched:
      selector: 'a[href*="snatched"], a[href*="viewsnatches"]'
    downloadvolumefactor:
      selector: td
      case:
        img.pro_free: 0
        img.pro_free2up: 0
        img.pro_50pctdown: 0.5
        img.pro_50pctdown2up: 0.5
        img.pro_30pctdown: 0.3
        "*": 1
    uploadvolumefactor:
      selector: td
      case:
        img.pro_free2up: 2
        img.pro_50pctdown2up: 2
        img.pro_2up: 2
        "*": 1
    tags:
      selector: table.torrentname span[style*="background-color"]
    # 本站促销 img 无 onmouseover、无剩余时间 span → 此字段恒空（勿绑 span[title]，会误中发布时间）
    free_deadline:
      selector: img.pro_free,img.pro_free2up
      attribute: onmouseover
      filters:
        - name: re_search
          args: [ 'title="(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})"', 1 ]
