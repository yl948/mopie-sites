# 库非 kufei.org — NexusPHP
# 适配: 2026-09 实测。列: 1类型 2标题 3评论 4时间 5大小 6种子 7下载 8完成 9发布者
# 列表无 tbody 源码，goquery 会补 tbody。内层 torrentname 行没有 td.rowfollow。
# 折扣截止在 img.pro_free / pro_free2up 的 onmouseover（50% 无剩余时间）。
# 不要用 span[title^="20"]：发布时间也是 span[title=2023-...]，会误当成截止。
id: kufei
name: 库非
domain: https://kufei.org/
encoding: UTF-8

login:
  test:
    selector: a[href="logout.php"]

# 分类来自 torrents.php 导航 + 种子行 img[class^=c_] alt（2026-09 实测）
category_mappings:
  - { id: 401, cate_level1: Movie, cate_level2: Movies, cate_level2_desc: "电影" }
  - { id: 402, cate_level1: TV, cate_level2: TV, cate_level2_desc: "电视剧" }
  - { id: 403, cate_level1: TV, cate_level2: TV, cate_level2_desc: "综艺" }
  - { id: 404, cate_level1: Documentary, cate_level2: TV/Documentary, cate_level2_desc: "纪录片" }
  - { id: 405, cate_level1: Anime, cate_level2: TV/Anime, cate_level2_desc: "动漫" }
  - { id: 406, cate_level1: Music, cate_level2: Audio/Video, cate_level2_desc: "MV" }
  - { id: 407, cate_level1: TV, cate_level2: TV/Sport, cate_level2_desc: "体育" }
  - { id: 408, cate_level1: Music, cate_level2: Audio, cate_level2_desc: "音乐" }
  - { id: 409, cate_level1: Other, cate_level2: Other, cate_level2_desc: "其他" }
  - { id: 410, cate_level1: Other, cate_level2: Other, cate_level2_desc: "游戏" }
  - { id: 411, cate_level1: Other, cate_level2: Other, cate_level2_desc: "电子书" }
  - { id: 412, cate_level1: Other, cate_level2: Other, cate_level2_desc: "软件" }
  - { id: 413, cate_level1: Other, cate_level2: Other, cate_level2_desc: "教育" }
  - { id: 414, cate_level1: Music, cate_level2: Audio/Video, cate_level2_desc: "演唱会" }
  - { id: 415, cate_level1: TV, cate_level2: TV, cate_level2_desc: "戏剧" }
  - { id: 416, cate_level1: Other, cate_level2: Audio, cate_level2_desc: "有声读物" }

userinfo:
  path: https://kufei.org/index.php
  item:
    selector: table[id="info_block"]
  fields:
    uid:
      default_value: 0
      selector: a[href*="userdetails.php?id="]
      attribute: href
      filters:
        - name: re_search
          args: [ '\d+', 0 ]
    user_group:
      default_value: ''
      selector: a[href*="userdetails.php?id="]
      attribute: class
    username:
      default_value: '未知用户名'
      selector: a[href*="userdetails.php?id="] b
    share_ratio:
      default_value: ''
      selector: "font.color_ratio"
      method: next_sibling
      filters:
        - name: replace
          args: [ '无限','inf' ]
    uploaded:
      default_value: 0
      selector: "font.color_uploaded"
      method: next_sibling
      filters:
        - name: replace
          args: [ '无限','inf' ]
    downloaded:
      default_value: 0
      selector: "font.color_downloaded"
      method: next_sibling
      filters:
        - name: replace
          args: [ '无限','inf' ]
    seeding:
      default_value: 0
      selector: img[alt="Torrents seeding"]
      method: next_sibling
    leeching:
      default_value: 0
      selector: img[alt="Torrents leeching"]
      method: next_sibling

search:
  paths:
    - path: torrents.php
      method: get
  query:
    $raw: "{% for c in query.cates %}cat{{c}}=1&{% endfor %}"
    search: "{% if query.imdb_id %}{{query.imdb_id}}{%else%}{{query.keyword}}{% endif %}"
    incldead: 1
    spstate: "{% if query.free %}2{% else %}0{% endif %}"
    search_area: "{% if query.imdb_id %}4{% else %}0{%endif%}"
    search_mode: 0
    sort: "{{ query.sort }}"
    type: "{{ query.type }}"
    page: "{{ query.page }}"

# 列结构实测: 1类型 2标题 3评论 4时间(span[title]=绝对时间) 5大小 6种子 7下载 8完成 9发布者
# page=0 首页（含置顶），page=1 下一页，无 skip_page1 语义差异
torrents:
  list:
    selector: table.torrents > tbody > tr:has(table.torrentname)
  fields:
    id:
      selector: table.torrentname a[href^="download.php?id="]
      attribute: href
      filters:
        - name: re_search
          args: [ '\d+', 0 ]
    title_default:
      selector: table.torrentname a[href^="details.php?id="]
    title_optional:
      optional: true
      selector: table.torrentname a[title][href^="details.php?id="]
      attribute: title
    title:
      text: "{% if fields['title_optional'] %}{{ fields['title_optional'] }}{% else %}{{ fields['title_default'] }}{% endif %}"
    subject:
      selector: table.torrentname td.embedded:has(a[href*='details.php'])
      contents: -1
    category:
      selector: td:first-child a[href^="?cat="]
      attribute: href
      filters:
        - name: replace
          args: ["?", ""]
        - name: querystring
          args: ["cat"]
    details:
      selector: table.torrentname a[href^="details.php?id="]
      attribute: href
    download:
      selector: table.torrentname a[href^="download.php?id="]
      attribute: href
    size:
      selector: td.rowfollow:nth-child(5)
    date_added:
      selector: td.rowfollow:nth-child(4) > span[title]
      attribute: title
      filters:
        - name: dateparse
          args: "%Y-%m-%d %H:%M:%S"
    seeders:
      selector: 'a[href*="#seeders"]'
    leechers:
      selector: 'a[href*="#leechers"]'
    snatched:
      selector: 'a[href*="snatched"], a[href*="viewsnatches"]'
    downloadvolumefactor:
      selector: td
      case:
        img.pro_free: 0
        img.pro_free2up: 0
        img.pro_50pctdown: 0.5
        img.pro_50pctdown2up: 0.5
        img.pro_30pctdown: 0.3
        "*": 1
    uploadvolumefactor:
      selector: td
      case:
        img.pro_free2up: 2
        img.pro_50pctdown2up: 2
        img.pro_2up: 2
        "*": 1
    tags:
      selector: table.torrentname span[style*="background-color"]
    free_deadline:
      selector: img.pro_free,img.pro_free2up
      attribute: onmouseover
      filters:
        - name: re_search
          args: [ 'title="(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})"', 1 ]
