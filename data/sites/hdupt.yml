# 雷区HDU pt.hdupt.com — NexusPHP 经典皮肤
# 适配: 2026-10-07 实测。列: 1类型 2标题 3评论 4时间 5大小 6种子 7下载 8完成 9发布者
# 结构要点:
# - 嵌套表 2 格: td0=标题格(标题 a[title] + font.new"新" + 促销 img + <br/> 后裸文本副标题)
#               td1=下载/收藏/RSS 操作格（无海报格、无评分列）
# - 促销 img.pro_free / pro_50pctdown / pro_30pctdown，均无 onmouseover、无剩余时间 → free_deadline 恒空
#   （勿绑 span[title]，会误中时间列的发布时间，见 pitfalls #19）
# - 全站无标签 span（无 background-color/torrent-tag），tags 选择器恒空属正常
# - userinfo 与库非同构（font.color_*）；做种/下载数是裸文本节点 → 不配（同春天先例）
# - incldead 反语义（同 keepfrds）: 0=包括断种 1=仅活种 2=仅断种 → 必须写 0
# - 站点响应偏慢（首页 3-11s），搜索偶发超时重试即可
id: hdupt
name: 雷区
domain: https://pt.hdupt.com/
encoding: UTF-8

login:
  test:
    selector: a[href="logout.php"]

# 分类来自搜索表单复选框（2026-10-07 实测）。该站无 409，410=游戏、411=其他
category_mappings:
  - { id: 401, cate_level1: Movie, cate_level2: Movies, cate_level2_desc: "电影" }
  - { id: 402, cate_level1: TV, cate_level2: TV, cate_level2_desc: "电视剧" }
  - { id: 403, cate_level1: TV, cate_level2: TV, cate_level2_desc: "综艺" }
  - { id: 404, cate_level1: Documentary, cate_level2: TV/Documentary, cate_level2_desc: "纪录片" }
  - { id: 405, cate_level1: Anime, cate_level2: TV/Anime, cate_level2_desc: "动画" }
  - { id: 406, cate_level1: Music, cate_level2: Audio/Video, cate_level2_desc: "MV" }
  - { id: 407, cate_level1: TV, cate_level2: TV/Sport, cate_level2_desc: "体育" }
  - { id: 408, cate_level1: Music, cate_level2: Audio, cate_level2_desc: "无损音乐" }
  - { id: 410, cate_level1: Other, cate_level2: Other, cate_level2_desc: "游戏" }
  - { id: 411, cate_level1: Other, cate_level2: Other, cate_level2_desc: "其他" }

userinfo:
  path: https://pt.hdupt.com/index.php
  item:
    selector: table[id="info_block"]
  fields:
    uid:
      default_value: 0
      selector: a[href*="userdetails.php?id="]
      attribute: href
      filters:
        - name: re_search
          args: [ '\d+', 0 ]
    user_group:
      default_value: ''
      selector: a[href*="userdetails.php?id="]
      attribute: class
    username:
      default_value: '未知用户名'
      selector: a[href*="userdetails.php?id="] b
    share_ratio:
      default_value: ''
      selector: "font.color_ratio"
      method: next_sibling
      filters:
        - name: replace
          args: [ '无限','inf' ]
    uploaded:
      # 上传量的值与下一个 font 之间没有空白边界，next_sibling 的 \s{2,} 切分会把
      # “下载量：27.92 GB”一起吞进来 → 改用容器全文 + re_search 捕获组直取
      default_value: 0
      selector: "span.medium"
      filters:
        - name: re_search
          args: [ '上传量[：:]\s*([\d.]+\s*[KMGTP]i?B)', 1 ]
        - name: replace
          args: [ '无限','inf' ]
    downloaded:
      default_value: 0
      selector: "font.color_downloaded"
      method: next_sibling
      filters:
        - name: replace
          args: [ '无限','inf' ]
    # 做种/下载数不配：裸文本节点，next_sibling 会抓到「欢迎回来, …」

search:
  paths:
    - path: torrents.php
      method: get
  query:
    $raw: "{% for c in query.cates %}cat{{c}}=1&{% endfor %}"
    search: "{% if query.imdb_id %}{{query.imdb_id}}{%else%}{{query.keyword}}{% endif %}"
    # 本站 incldead 反语义: 0=包括断种（写 0 才等于标准站的 incldead=1）
    incldead: 0
    spstate: "{% if query.free %}2{% else %}0{% endif %}"
    search_area: "{% if query.imdb_id %}4{% else %}0{%endif%}"
    search_mode: 0
    sort: "{{ query.sort }}"
    type: "{{ query.type }}"
    page: "{{ query.page }}"

# page=0(15条) 与 page=1(50条) 零重叠，无置顶 → skip_page1: false
torrents:
  list:
    selector: table.torrents > tbody > tr:has(table.torrentname)
  fields:
    id:
      selector: table.torrentname a[href^="download.php?id="]
      attribute: href
      filters:
        - name: re_search
          args: [ '\d+', 0 ]
    title_default:
      selector: table.torrentname a[href^="details.php?id="]
    title_optional:
      optional: true
      selector: table.torrentname a[title][href^="details.php?id="]
      attribute: title
    title:
      text: "{% if fields['title_optional'] %}{{ fields.title_optional }}{% else %}{{ fields.title_default }}{% endif %}"
    # 副标题 = 标题格 <br/> 后裸文本；首格即标题格（无海报），extractNexusSubject 的
    # br 后取文本会覆盖 YAML，故不写 subject 字段，靠解析器内置提取
    category:
      selector: td:first-child a[href^="?cat="]
      attribute: href
      filters:
        - name: replace
          args: ["?", ""]
        - name: querystring
          args: ["cat"]
    details:
      selector: table.torrentname a[href^="details.php?id="]
      attribute: href
    download:
      selector: table.torrentname a[href^="download.php?id="]
      attribute: href
    size:
      selector: td.rowfollow:nth-child(5)
    date_added:
      selector: td.rowfollow:nth-child(4) > span[title]
      attribute: title
      filters:
        - name: dateparse
          args: "%Y-%m-%d %H:%M:%S"
    seeders:
      selector: 'a[href*="#seeders"]'
    leechers:
      selector: 'a[href*="#leechers"]'
    snatched:
      selector: 'a[href*="snatched"], a[href*="viewsnatches"]'
    downloadvolumefactor:
      selector: td
      case:
        img.pro_free: 0
        img.pro_free2up: 0
        img.pro_50pctdown: 0.5
        img.pro_50pctdown2up: 0.5
        img.pro_30pctdown: 0.3
        "*": 1
    uploadvolumefactor:
      selector: td
      case:
        img.pro_free2up: 2
        img.pro_50pctdown2up: 2
        img.pro_2up: 2
        "*": 1
    tags:
      selector: table.torrentname span[style*="background-color"]
    free_deadline:
      selector: img.pro_free,img.pro_free2up
      attribute: onmouseover
      filters:
        - name: re_search
          args: [ 'title="(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})"', 1 ]
