# 下水道PT sewerpt.com — NexusPHP 经典皮肤
# 适配: 2026-10-06 实测。列: 1类型 2标题 3评论 4时间 5大小 6种子 7下载 8完成 9发布者
# 与库非同骨架，差异：① 无 #seeders/#leechers 锚点，做种/下载用 nth-child(6)/(7)；
# ② 嵌套表 3 格（标题/ N/A /下载箭头），首格即标题+促销+标签+副标题（无海报格）；
# ③ 标签是无 class 的 span[style*="background-color"]；④ getusertorrentlistajax 现返回
#   "N 条记录 | 总大小：XX GB"（2026-09 记录的 500 已过时）。
id: sewerpt
name: 下水道PT
domain: https://sewerpt.com/
encoding: UTF-8

login:
  test:
    selector: a[href="logout.php"]

# 分类来自搜索表单 cat401-409 复选框（该站只有这 7 类，无 406/407）
category_mappings:
  - { id: 401, cate_level1: Movie, cate_level2: Movies, cate_level2_desc: "电影" }
  - { id: 402, cate_level1: TV, cate_level2: TV, cate_level2_desc: "电视剧" }
  - { id: 403, cate_level1: TV, cate_level2: TV, cate_level2_desc: "综艺" }
  - { id: 404, cate_level1: Documentary, cate_level2: TV/Documentary, cate_level2_desc: "纪录片" }
  - { id: 405, cate_level1: Anime, cate_level2: TV/Anime, cate_level2_desc: "动漫" }
  - { id: 408, cate_level1: Music, cate_level2: Audio, cate_level2_desc: "音乐" }
  - { id: 409, cate_level1: Other, cate_level2: Other, cate_level2_desc: "其他" }

userinfo:
  path: https://sewerpt.com/index.php
  item:
    selector: table[id="info_block"]
  fields:
    uid:
      default_value: 0
      selector: a[href*="userdetails.php?id="]
      attribute: href
      filters:
        - name: re_search
          args: [ '\d+', 0 ]
    user_group:
      default_value: ''
      selector: a[href*="userdetails.php?id="]
      attribute: class
    username:
      default_value: '未知用户名'
      selector: a[href*="userdetails.php?id="] b
    share_ratio:
      default_value: ''
      selector: "font.color_ratio"
      method: next_sibling
      filters:
        - name: replace
          args: [ '无限','inf' ]
    uploaded:
      default_value: 0
      selector: "font.color_uploaded"
      method: next_sibling
      filters:
        - name: replace
          args: [ '无限','inf' ]
    downloaded:
      default_value: 0
      selector: "font.color_downloaded"
      method: next_sibling
      filters:
        - name: replace
          args: [ '无限','inf' ]
    # 做种/下载数不配（同春天）：计数是裸文本节点，next_sibling 会抓到
    # “欢迎回来, …”，且 sites 表本就没有这两列

search:
  paths:
    - path: torrents.php
      method: get
  query:
    $raw: "{% for c in query.cates %}cat{{c}}=1&{% endfor %}"
    search: "{% if query.imdb_id %}{{query.imdb_id}}{%else%}{{query.keyword}}{% endif %}"
    incldead: 1
    spstate: "{% if query.free %}2{% else %}0{% endif %}"
    search_area: "{% if query.imdb_id %}4{% else %}0{%endif%}"
    search_mode: 0
    sort: "{{ query.sort }}"
    type: "{{ query.type }}"
    page: "{{ query.page }}"

# page=0 与 page=1 零重叠（id 连续），skip_page1 语义同库非：无需特殊处理
torrents:
  list:
    selector: table.torrents > tbody > tr:has(table.torrentname)
  fields:
    id:
      selector: table.torrentname a[href^="download.php?id="]
      attribute: href
      filters:
        - name: re_search
          args: [ '\d+', 0 ]
    title_default:
      selector: table.torrentname a[href^="details.php?id="]
    title_optional:
      optional: true
      selector: table.torrentname a[title][href^="details.php?id="]
      attribute: title
    title:
      text: "{% if fields['title_optional'] %}{{ fields.title_optional }}{% else %}{{ fields.title_default }}{% endif %}"
    subject:
      selector: table.torrentname td.embedded:has(a[href*='details.php'])
      contents: -1
    category:
      selector: td:first-child a[href^="?cat="]
      attribute: href
      filters:
        - name: replace
          args: ["?", ""]
        - name: querystring
          args: ["cat"]
    details:
      selector: table.torrentname a[href^="details.php?id="]
      attribute: href
    download:
      selector: table.torrentname a[href^="download.php?id="]
      attribute: href
    size:
      selector: td.rowfollow:nth-child(5)
    date_added:
      selector: td.rowfollow:nth-child(4) > span[title]
      attribute: title
      filters:
        - name: dateparse
          args: "%Y-%m-%d %H:%M:%S"
    # 本站无 dllist=1#seeders 锚点（其他站通用写法在此取空），用列偏移
    seeders:
      selector: td.rowfollow:nth-child(6)
    leechers:
      selector: td.rowfollow:nth-child(7)
    snatched:
      selector: 'a[href*="snatched"], a[href*="viewsnatches"]'
    downloadvolumefactor:
      selector: td
      case:
        img.pro_free: 0
        img.pro_free2up: 0
        img.pro_50pctdown: 0.5
        img.pro_50pctdown2up: 0.5
        img.pro_30pctdown: 0.3
        "*": 1
    uploadvolumefactor:
      selector: td
      case:
        img.pro_free2up: 2
        img.pro_50pctdown2up: 2
        img.pro_2up: 2
        "*": 1
    tags:
      selector: table.torrentname span[style*="background-color"]
    free_deadline:
      selector: img.pro_free,img.pro_free2up
      attribute: onmouseover
      filters:
        - name: re_search
          args: [ 'title="(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})"', 1 ]
