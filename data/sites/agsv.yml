# AGSVPT 末日 www.agsvpt.com — NexusPHP
# 适配: 2026-09 实测。列: 1类型 2标题 3评论 4时间 5大小 6种子 7下载 8完成 9发布者
# 关键差异（与 kufei 同构但有一处必须显式配）：
#   * 无 tbody，用 table.torrents tr:has(table.torrentname)
#   * 内层 torrentname 4 列：海报 | 标题 | 评分 | 下载。海报是第一格，
#     所以 titleEmbedded() 命中海报格 → extractNexusTags 拿不到标签（标签在第二格），
#     必须显式写 tags 选择器；同理 extractNexusSubject 返回空，YAML subject 生效。
#   * 免费/2X免费有 onmouseover 剩余时间；50% 无剩余时间（img.pro_50pctdown 无 onmouseover）
#   * page=0 首页（16 条置顶 + 正常），page=1/2 顺序推进，页间无重叠，无 skip_page1 陷阱
#   * domain 必须带 www：裸 agsvpt.com 会 302
id: agsv
name: 末日
domain: https://www.agsvpt.com/
encoding: UTF-8

login:
  test:
    selector: a[href="logout.php"]

# 分类来自 torrents.php 导航（2026-09 实测）
category_mappings:
  - { id: 401, cate_level1: Movie, cate_level2: Movies, cate_level2_desc: "电影" }
  - { id: 402, cate_level1: TV, cate_level2: TV, cate_level2_desc: "剧集" }
  - { id: 403, cate_level1: TV, cate_level2: TV, cate_level2_desc: "综艺" }
  - { id: 404, cate_level1: Documentary, cate_level2: TV/Documentary, cate_level2_desc: "纪录" }
  - { id: 405, cate_level1: Anime, cate_level2: TV/Anime, cate_level2_desc: "动漫" }
  - { id: 406, cate_level1: Music, cate_level2: Audio/Video, cate_level2_desc: "演唱" }
  - { id: 407, cate_level1: TV, cate_level2: TV/Sport, cate_level2_desc: "体育" }
  - { id: 408, cate_level1: Other, cate_level2: Audio, cate_level2_desc: "音频" }
  - { id: 411, cate_level1: Music, cate_level2: Audio, cate_level2_desc: "音乐" }
  - { id: 412, cate_level1: Other, cate_level2: Other, cate_level2_desc: "软件" }
  - { id: 413, cate_level1: Other, cate_level2: Other, cate_level2_desc: "游戏" }
  - { id: 415, cate_level1: Other, cate_level2: Audio, cate_level2_desc: "电子书/有声书" }
  - { id: 416, cate_level1: Other, cate_level2: Other, cate_level2_desc: "漫画" }
  - { id: 417, cate_level1: Other, cate_level2: Other, cate_level2_desc: "学习资料" }
  - { id: 418, cate_level1: Other, cate_level2: Other, cate_level2_desc: "图片" }
  - { id: 419, cate_level1: TV, cate_level2: TV, cate_level2_desc: "短剧" }

userinfo:
  path: https://www.agsvpt.com/index.php
  item:
    selector: table[id="info_block"]
  fields:
    uid:
      default_value: 0
      selector: a[href*="userdetails.php?id="]
      attribute: href
      filters:
        - name: re_search
          args: [ '\d+', 0 ]
    user_group:
      default_value: ''
      selector: a[href*="userdetails.php?id="]
      attribute: class
    username:
      default_value: '未知用户名'
      selector: a[href*="userdetails.php?id="] b
    share_ratio:
      default_value: ''
      selector: "font.color_ratio"
      method: next_sibling
      filters:
        - name: replace
          args: [ '无限','inf' ]
    uploaded:
      default_value: 0
      selector: "font.color_uploaded"
      method: next_sibling
      filters:
        - name: replace
          args: [ '无限','inf' ]
    downloaded:
      default_value: 0
      selector: "font.color_downloaded"
      method: next_sibling
      filters:
        - name: replace
          args: [ '无限','inf' ]
    seeding:
      default_value: 0
      selector: img[alt="Torrents seeding"]
      method: next_sibling
    leeching:
      default_value: 0
      selector: img[alt="Torrents leeching"]
      method: next_sibling

search:
  paths:
    - path: torrents.php
      method: get
  query:
    $raw: "{% for c in query.cates %}cat{{c}}=1&{% endfor %}"
    search: "{% if query.imdb_id %}{{query.imdb_id}}{%else%}{{query.keyword}}{% endif %}"
    incldead: 1
    spstate: "{% if query.free %}2{% else %}0{% endif %}"
    search_area: "{% if query.imdb_id %}4{% else %}0{%endif%}"
    search_mode: 0
    sort: "{{ query.sort }}"
    type: "{{ query.type }}"
    page: "{{ query.page }}"

torrents:
  list:
    selector: table.torrents tr:has(table.torrentname)
  fields:
    id:
      selector: table.torrentname a[href^="download.php?id="]
      attribute: href
      filters:
        - name: re_search
          args: [ '\d+', 0 ]
    title_default:
      selector: table.torrentname a[href^="details.php?id="]
    title_optional:
      optional: true
      selector: table.torrentname a[title][href^="details.php?id="]
      attribute: title
    title:
      text: "{% if fields['title_optional'] %}{{ fields['title_optional'] }}{% else %}{{ fields['title_default'] }}{% endif %}"
    # 副标题：中文正文在 div.torrent_title_desc 里，该 div 同时装了标签 span，
    # 所以必须把选择器指到这个 div 再取「最后一个子节点」，否则会把标签一起带进来
    # （内容形如「国语中字分集一瓯春」）。海报是第一格，extractNexusSubject 取不到，
    # 不会覆盖这里的值。
    subject:
      selector: 'div.torrent_title_desc'
      contents: -1
    # 必须显式配：标签在标题格，而 extractNexusTags 只看第一格（海报）会返回空
    tags:
      selector: 'table.torrentname td.embedded span[style*="background-color"]'
      join: true
    category:
      selector: td:first-child a[href^="?cat="]
      attribute: href
      filters:
        - name: replace
          args: ["?", ""]
        - name: querystring
          args: ["cat"]
    details:
      selector: table.torrentname a[href^="details.php?id="]
      attribute: href
    download:
      selector: table.torrentname a[href^="download.php?id="]
      attribute: href
    size:
      selector: td.rowfollow:nth-child(5)
    date_added:
      selector: td.rowfollow:nth-child(4) > span[title]
      attribute: title
      filters:
        - name: dateparse
          args: "%Y-%m-%d %H:%M:%S"
    seeders:
      selector: 'a[href*="#seeders"]'
    leechers:
      selector: 'a[href*="#leechers"]'
    snatched:
      selector: 'a[href*="snatched"], a[href*="viewsnatches"]'
    downloadvolumefactor:
      selector: td
      case:
        img.pro_free: 0
        img.pro_free2up: 0
        img.pro_50pctdown: 0.5
        img.pro_50pctdown2up: 0.5
        img.pro_30pctdown: 0.3
        "*": 1
    uploadvolumefactor:
      selector: td
      case:
        img.pro_free2up: 2
        img.pro_50pctdown2up: 2
        img.pro_2up: 2
        "*": 1
    free_deadline:
      selector: img.pro_free,img.pro_free2up
      attribute: onmouseover
      filters:
        - name: re_search
          args: [ 'title="(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})"', 1 ]
